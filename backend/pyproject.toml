[project]
name = "backend"
version = "0.1.0"
description = "Hybrid VPN control plane and Linux VM tunnel scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=45.0.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.0",
    "liboqs-python>=0.12.0",
    "pydantic>=2.11.0",
    "pyroute2>=0.9.3",
    "structlog>=25.4.0",
    "uvicorn>=0.35.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[project.scripts]
hybrid-vpn = "main:main"
